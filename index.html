<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1738">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
</head>
<body>
<title>Tic Tac Traditore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Rubik:wght@400;500;700&family=Chakra+Petch:wght@600;700&display=swap">
<style>
/* App a schermata singola: barra di stato in alto, contenuto al centro, azioni in basso. Mai scorrere.
   Identità: notte di festa. Indaco profondo, bomba rosso-arancio, miccia gialla, verde solo per "disinnescato".
   Due famiglie di carattere: Rubik per l'interfaccia, Chakra Petch per l'hardware della bomba. */
:root{
  --bg:#1c1738; --panel:#272048; --panel-2:#342b5f; --line:#4a4080; --ink:#f6f2ff; --mute:#a69fcc;
  --hot:#ff5b3d; --hot-dark:#c63d24; --go:#40de8f; --fuse:#ffc84a; --white:#ffffff;
  --f-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-hw:'Chakra Petch','Roboto Condensed','Arial Narrow',system-ui,sans-serif;
  --r:16px;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;overflow:hidden}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;display:flex;justify-content:center;align-items:center;background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);-webkit-tap-highlight-color:transparent}
#app{height:100%;max-height:900px;width:100%;max-width:480px;margin:0 auto;padding:0 16px;padding-block:12px 14px;display:flex;flex-direction:column;gap:10px}
.main{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:auto}
.center{justify-content:center}
.bottom{flex:none;display:flex;gap:10px}
.bottom>*{flex:1}
h1,h2,.display{font-family:var(--f-display);font-weight:400;margin:0;line-height:1;letter-spacing:.01em}
p{margin:0}
.mute{color:var(--mute)}
.small{font-size:.88rem}
.c{text-align:center}

/* pulsanti */
.btn{height:54px;border:0;border-radius:var(--r);background:var(--panel-2);color:var(--ink);font:500 1.05rem var(--f-body);cursor:pointer;padding:0 16px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--hot);color:var(--white);font-weight:700}
.btn.ghost{background:transparent;box-shadow:none;color:var(--mute);height:44px}
.btn.icon{flex:0 0 54px;padding:0}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn:focus-visible,.tile:focus-visible,.wrow:focus-visible,.arc:focus-visible,.name:focus-visible,.tab:focus-visible,.chip:focus-visible,.sw:focus-visible,.dkey:focus-visible{outline:3px solid var(--fuse);outline-offset:2px}
.btn svg{width:22px;height:22px}
.names-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.name{height:46px;border:0;border-radius:12px;background:var(--panel-2);color:var(--ink);font:500 1rem var(--f-body);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.22);padding:0 8px;overflow:hidden}
.name small{color:var(--mute);font-size:.75rem}
.name:disabled{opacity:.3}

/* setup */
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex:none}
.logo{font-family:var(--f-display);font-size:1.9rem;line-height:.95;color:var(--hot)}
.logo span{color:var(--ink)}
.pill{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:transparent;color:var(--ink);font:500 .9rem var(--f-body);cursor:pointer;flex:none}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.setting{background:var(--panel);border-radius:14px;padding:6px 8px;display:flex;align-items:center;justify-content:space-between;gap:4px}
.setting .k{font-size:.72rem;color:var(--mute);white-space:nowrap}
.setting .v{font:400 1.35rem var(--f-display);line-height:1.1}
.round{width:34px;height:34px;border-radius:50%;border:0;background:var(--panel-2);color:var(--ink);font:500 1.25rem/1 var(--f-body);cursor:pointer;flex:none}
.round:disabled{opacity:.3}
.chips{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--panel);padding:4px;border-radius:14px}
.chip{height:38px;border:0;border-radius:10px;background:transparent;color:var(--mute);font:500 .92rem var(--f-body);cursor:pointer;display:grid;place-items:center;line-height:1.1}
.chip.on{background:var(--panel-2);color:var(--ink);font-weight:700}
.chip small{display:block;font-size:.66rem;color:var(--mute);font-weight:400}
.toggle{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:8px 12px;border:0;color:var(--ink);font:500 .92rem var(--f-body);cursor:pointer;text-align:left;width:100%}
.toggle .sw-track{width:44px;height:26px;border-radius:13px;background:var(--panel-2);position:relative;flex:none;transition:background .15s}
.toggle .sw-track i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--mute);transition:transform .15s,background .15s}
.toggle.on .sw-track{background:var(--go)}
.toggle.on .sw-track i{transform:translateX(18px);background:var(--white)}
.toggle span{flex:1}
.toggle small{display:block;color:var(--mute);font-size:.76rem;font-weight:400}
.inputs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
input[type=text]{width:100%;height:40px;font:15px var(--f-body);padding:0 10px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
input[type=text]::placeholder{color:var(--mute);opacity:.7}
.resume{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:14px;padding:6px 6px 6px 12px}
.resume p{flex:1;font-size:.86rem}
.resume .btn{height:38px;font-size:.9rem;flex:0 0 auto;padding:0 12px}
.warn{font-size:.8rem;color:var(--fuse);text-align:center}

/* barra di stato */
.top{flex:none;background:var(--panel);border-radius:var(--r);padding:9px 12px;display:grid;gap:7px}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem;color:var(--mute)}
.top-row b{color:var(--ink);font-weight:700}
.pips{display:flex;gap:5px}
.pip{width:13px;height:13px;border-radius:50%;border:2px solid var(--line)}
.pip.on{background:var(--hot);border-color:var(--hot);box-shadow:0 0 8px var(--hot)}
.plate{display:inline-flex;align-items:center;gap:5px;background:#120e26;border:1px solid #3a3170;border-radius:7px;padding:1px 7px;font:700 .82rem var(--f-hw);letter-spacing:.04em;color:var(--mute)}
.plate .pn{color:var(--fuse);font-size:1.05rem}
.plate .psh{width:15px;height:15px;border-radius:4px;display:grid;place-items:center;background:var(--c);color:var(--t)}
.plate .psh svg{width:10px;height:10px}
.fuse{display:flex;align-items:center;gap:10px}
.fuse-track{flex:1;height:8px;border-radius:4px;background:var(--panel-2);overflow:hidden}
.fuse-bar{height:100%;background:var(--fuse);border-radius:4px;transition:width .2s linear}
.fuse-n{font:400 1.35rem/1 var(--f-display);color:var(--fuse);min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.fuse.hot .fuse-bar{background:var(--hot)} .fuse.hot .fuse-n{color:var(--hot);animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
.alert{flex:none;border-radius:12px;padding:7px 12px;font-size:.9rem;background:rgba(255,200,74,.12);color:var(--fuse)}
.alert.red{background:rgba(255,91,61,.15);color:#ff9a86}
.hint{flex:none;font-size:.88rem;color:var(--mute);text-align:center}

/* passaggi */
.big-name{font-family:var(--f-display);font-size:clamp(2.6rem,13vw,3.6rem);color:var(--fuse);line-height:1;text-align:center;word-break:break-word}
.stack{display:grid;gap:8px;justify-items:center;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border-radius:var(--r);padding:11px 6px;text-align:center;display:grid;gap:2px}
.stat b{font:400 1.7rem/1 var(--f-display)}
.stat span{font-size:.78rem;color:var(--mute)}

/* forme dei colori */
.sh{display:block;width:1em;height:1em;flex:none}
.cc{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 5px;border-radius:999px;background:var(--c);color:var(--t);font-weight:700;font-size:.9em;white-space:nowrap;box-shadow:0 0 0 1px rgba(255,255,255,.3);vertical-align:1px}
.cc .sh{width:.82em;height:.82em}
.kl{display:inline-block;padding:0 6px;border-radius:6px;border:2px solid var(--ink);font:700 .82em var(--f-hw);letter-spacing:.04em;vertical-align:1px}
.dir{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:6px;background:var(--panel-2);color:var(--fuse);font-size:.9em;vertical-align:-.3em}
.key{color:var(--fuse);font-weight:700}

/* frammenti */
.frag{background:var(--panel);border-radius:var(--r);padding:11px 14px 13px;display:grid;gap:7px;border-left:4px solid var(--line)}
.frag.osserva{border-left-color:var(--fuse)}
.frag.agisci{border-left-color:var(--hot)}
.fh{display:flex;align-items:center;gap:7px;font:600 .68rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.fh svg.ic{width:17px;height:17px;flex:none}
.fh b{color:var(--ink);font-weight:700}
.frag.osserva .fh b{color:var(--fuse)} .frag.agisci .fh b{color:var(--hot)}
.fm{font-size:1.1rem;line-height:1.55}
.fn{font-size:.84rem;color:var(--mute);line-height:1.4}
.role{font-family:var(--f-display);font-size:2.3rem;line-height:1}
.role.S{color:var(--hot)} .role.A{color:var(--go)}
.line{background:var(--panel);border-radius:var(--r);padding:11px 14px;font-size:.94rem}
.sect{font:600 .68rem var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-top:4px}

/* bomba */
.mods{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mods.rows-1{grid-template-rows:minmax(0,1fr)} .mods.rows-2{grid-template-rows:repeat(2,minmax(0,1fr))} .mods.rows-3{grid-template-rows:repeat(3,minmax(0,1fr))}
.tile{position:relative;border-radius:18px;padding:7px 10px 9px;display:flex;flex-direction:column;gap:3px;border:2px solid rgba(255,255,255,.04);min-height:0;
  background:radial-gradient(circle at 9px 9px,#4a4080 2px,transparent 2.5px),radial-gradient(circle at calc(100% - 9px) 9px,#4a4080 2px,transparent 2.5px),radial-gradient(circle at 9px calc(100% - 9px),#4a4080 2px,transparent 2.5px),radial-gradient(circle at calc(100% - 9px) calc(100% - 9px),#4a4080 2px,transparent 2.5px),linear-gradient(180deg,#2b2350,#231c43)}
.tile.wide{grid-column:1/-1}
.tile.picked{border-color:rgba(255,200,74,.55)}
.tile.flash-green{animation:fg 1.1s ease-out} .tile.flash-red{animation:fr 1.1s ease-out}
@keyframes fg{0%{box-shadow:0 0 0 4px var(--go),0 0 30px var(--go)}100%{box-shadow:none}}
@keyframes fr{0%{box-shadow:0 0 0 4px var(--hot),0 0 30px var(--hot);transform:translateX(-4px)}10%{transform:translateX(4px)}20%{transform:translateX(-3px)}30%{transform:none}100%{box-shadow:none}}
.tile.last{border-color:var(--hot);animation:heart 1s infinite}
@keyframes heart{0%,40%,100%{box-shadow:none}10%,30%{box-shadow:0 0 0 3px var(--hot),0 0 22px rgba(255,91,61,.5)}}
.tile-h{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 4px;flex:none}
.tile-h .id{font:400 1.2rem/1 var(--f-display)}
.tile-h .ty{font:600 .68rem var(--f-hw);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);flex:1}
.led{width:20px;height:20px;border-radius:50%;background:var(--panel-2);border:2px solid var(--line);display:grid;place-items:center;font:700 .72rem/1 var(--f-body);color:var(--bg);flex:none}
.led.green{background:var(--go);border-color:var(--go);box-shadow:0 0 10px var(--go)}
.led.red{background:var(--hot);border-color:var(--hot);box-shadow:0 0 10px var(--hot);color:var(--white)}
.led.wait{background:var(--fuse);border-color:var(--fuse);animation:blink .3s steps(2) infinite}
.mod-body{flex:1;min-height:0;container-type:size;display:flex;align-items:center;justify-content:center}
.mod-note{flex:none;font:600 .62rem var(--f-hw);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:center}

/* cavi */
.wlist{width:100%;max-width:340px;height:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:clamp(1px,3.5cqh,16px)}
.wrow{flex:1 1 0;min-height:0;max-height:40px;overflow:hidden;display:flex;align-items:center;border:0;background:transparent;border-radius:10px;padding:0 4px;cursor:pointer;color:var(--mute);font:700 clamp(.55rem,3cqh,.8rem) var(--f-hw);--ws:9}
.wrow.sel{background:rgba(255,200,74,.1)}
.wrow:disabled{cursor:default}
.wrow .wn{width:15px;text-align:left;flex:none}
.wrow .wtag{width:clamp(13px,4.6cqh,19px);height:clamp(13px,4.6cqh,19px);border-radius:50%;flex:none;display:grid;place-items:center;background:var(--c);color:var(--t);box-shadow:0 0 0 1.5px rgba(255,255,255,.35);margin-right:5px;font-size:clamp(8px,3cqh,11px)}
.wrow.cut .wtag{opacity:.5}
.wrow .term{width:7px;height:clamp(10px,4.2cqh,17px);border-radius:2px;background:#8f88bd;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.wrow .wsvg{flex:1;min-width:0;height:100%;position:relative}
.wrow .wsvg svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wrow .wo{fill:none;stroke:rgba(255,255,255,.28);stroke-width:calc(var(--ws) * 1px + 2px);stroke-linecap:round;vector-effect:non-scaling-stroke}
.wrow .ws{fill:none;stroke-width:calc(var(--ws) * 1px);stroke-linecap:round;vector-effect:non-scaling-stroke}
.wrow .wsel{fill:none;stroke:var(--fuse);stroke-width:calc(var(--ws) * 1px + 8px);stroke-linecap:round;vector-effect:non-scaling-stroke}
@container (max-height:150px){.mod-body .wrow{--ws:6}}
@container (max-height:105px){.mod-body .wrow{--ws:4.5}}
.wrow .fray{fill:none;stroke:#e9a25a;stroke-width:1.8;stroke-linecap:round;vector-effect:non-scaling-stroke}
.wrow.justcut .ws{animation:snapw .5s ease-out}
@keyframes snapw{0%{filter:brightness(3)}100%{filter:none}}

/* pulsanti */
.arc-grid{width:100%;max-width:300px;height:100%;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,minmax(0,124px));align-content:center;gap:8px}
.arc-grid.wide{max-width:520px;grid-template-columns:repeat(4,1fr);grid-template-rows:minmax(0,124px)}
.arc-cell{container-type:size;min-height:0;display:grid;place-items:center}
.arc{width:min(100cqw,100cqh);height:min(100cqw,100cqh);border:0;border-radius:50%;padding:4px;cursor:pointer;background:#141029;box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 3px 0 rgba(0,0,0,.4);position:relative}
.arc .cap{display:grid;place-content:center;justify-items:center;gap:1px;width:100%;height:100%;border-radius:50%;color:var(--t);font:700 clamp(.58rem,15cqw,.88rem)/1.1 var(--f-hw);letter-spacing:.04em;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.55),rgba(255,255,255,0) 32%),var(--c);box-shadow:inset 0 -5px 0 rgba(0,0,0,.28),0 4px 0 rgba(0,0,0,.35);transition:transform .08s}
.arc .capsh{display:block;font-size:clamp(.5rem,13cqw,.76rem);opacity:.9;line-height:0}
.arc .bn{position:absolute;top:2px;left:50%;transform:translateX(-50%);font:700 .6rem var(--f-hw);color:var(--mute)}
.arc.sel{outline:3px solid var(--fuse);outline-offset:2px}
.arc.pressed .cap,.arc:active .cap{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.28),0 1px 0 rgba(0,0,0,.35)}
.arc.justpressed .cap{animation:press .35s ease-out}
@keyframes press{40%{transform:translateY(6px) scale(.94)}100%{transform:translateY(3px)}}
.arc:disabled{cursor:default}

/* pomello */
.knob-wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:4px}
.knob-wrap.wide{flex-direction:row;justify-content:center;gap:16px}
.kinfo{display:flex;align-items:center;gap:8px;flex:none}
.knob-wrap.wide .kinfo{flex-direction:column}
.kinfo .lcd{display:flex;align-items:baseline;gap:6px;background:#120e26;border:1px solid #3a3170;border-radius:8px;padding:2px 9px}
.kinfo .lcd small{font:600 .62rem var(--f-hw);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.kinfo .lcd b{font:700 1.3rem/1 var(--f-hw);color:var(--fuse);text-shadow:0 0 8px rgba(255,200,74,.6)}
.dial-box{flex:1;min-height:0;min-width:0;width:100%;container-type:size;display:grid;place-items:center}
.knob-wrap.wide .dial-box{flex:0 1 220px;height:100%;width:auto}
svg.dial{width:min(100cqw,100cqh,230px);height:min(100cqw,100cqh,230px)}
.dial .plateC{fill:#1a1538;stroke:#3a3170;stroke-width:1.5}
.dial .tick{stroke:#5b5296;stroke-width:2;stroke-linecap:round}
.dial .tick.on{stroke:var(--fuse)}
.dial .num text{fill:var(--mute);font:700 11px var(--f-hw);text-anchor:middle;pointer-events:none}
.dial .num.on text{fill:var(--fuse)}
.dial .numhit{fill:transparent}
.dial .num[data-a]{cursor:pointer}
.dial .knurl{fill:none;stroke:#110d24;stroke-width:4;stroke-dasharray:2.1 2.1}
.dial .ptr{fill:var(--fuse)}
.dial .knob-g{transform-origin:60px 60px;transform-box:view-box;transition:transform .35s cubic-bezier(.3,1.4,.6,1)}
.dial .knob-g[data-a]{cursor:pointer}
@container (max-height:160px){
 .mod-body .knob-wrap{flex-direction:row;justify-content:center;gap:8px}
 .mod-body .knob-wrap .dial-box{flex:1 1 0;min-width:0;height:100%;width:auto}
 .mod-body .kinfo .lcd{flex-direction:column;align-items:center;gap:0;padding:2px 7px}
}

/* sequenza */
.seq{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(5px,5cqh,14px)}
.seq-slots{display:flex;gap:4px;justify-content:center;max-width:100%}
.seq-slots i{width:clamp(14px,min(18cqh,15cqw),40px);height:clamp(14px,min(18cqh,15cqw),40px);flex:none;border-radius:8px;background:#120e26;border:1.5px solid #3a3170;display:grid;place-items:center;font-style:normal;font-size:clamp(.6rem,min(11cqh,9cqw),1.3rem);color:var(--fuse)}
.seq-slots i.empty{color:#3a3170}
.dpad{display:flex;gap:4px;width:100%;max-width:260px;justify-content:center}
.dkey{flex:1 1 0;min-width:0;max-width:52px;height:clamp(26px,min(22cqh,17cqw),52px);border:0;border-radius:11px;background:var(--panel-2);color:var(--ink);font-size:clamp(.9rem,11cqh,1.4rem);cursor:pointer;display:grid;place-items:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.3)}
.dkey:active{transform:translateY(2px)}
.dkey.del{color:var(--mute);font-size:clamp(.8rem,4cqh,1rem)}
.dkey:disabled{opacity:.35}

/* interruttori */
.swlist{width:100%;max-width:320px;height:100%;margin:0 auto;display:flex;flex-direction:column;justify-content:center;gap:clamp(1px,2.5cqh,11px)}
.sw{flex:1 1 0;min-height:0;max-height:42px;overflow:hidden;display:flex;align-items:center;gap:6px;border:0;background:transparent;border-radius:10px;padding:0 4px;cursor:pointer;color:var(--mute);font:700 clamp(.55rem,2.8cqh,.78rem) var(--f-hw)}
.sw:disabled{cursor:default}
.sw .wtag{width:clamp(13px,4.6cqh,19px);height:clamp(13px,4.6cqh,19px);border-radius:50%;flex:none;display:grid;place-items:center;background:var(--c);color:var(--t);box-shadow:0 0 0 1.5px rgba(255,255,255,.35);font-size:clamp(8px,3cqh,11px)}
.sw .track{flex:1;max-width:90px;height:clamp(13px,5cqh,28px);border-radius:999px;background:#17122f;box-shadow:inset 0 2px 4px rgba(0,0,0,.5);position:relative;transition:background .15s}

/* Generatore QR minimo, interno al gioco: modalità byte, correzione M, versioni 1–20. */
const QR=(()=>{
  const ECC=[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26];
  const BLK=[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16];

    put(4,4);put(bytes.length,ver<10?8:16);bytes.forEach(b=>put(b,8));
    put(0,Math.min(4,cap-bits.length));while(bits.length%8)bits.push(0);
    for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);

})();

    if(t===0){f0={role:'osserva',tag:'Il cavo chiave',main:`Il <span class="key">cavo chiave</span> è l'<b>ultimo</b> cavo ${C(col)}.`};needs={wireCol:col}}
    else if(t===1){f0={role:'osserva',tag:'Il cavo chiave',main:`Il <span class="key">cavo chiave</span> è il <b>primo</b> cavo ${C(col)}.`};needs={wireCol:col}}
    else {f0={role:'osserva',tag:'Il cavo chiave',main:`Il <span class="key">cavo chiave</span> è il <b>primo</b> cavo del colore della <b>targhetta</b>.`};needs={wireTag:true}}
    const key=(m,tag)=>{const c=t===2?tag.c:col;let i=-1;m.wires.forEach((w,j)=>{if(w.c===c&&(t===0||i<0))i=j});return i<0?0:i};
    if(f2===0){f1={role:'agisci',tag:'Taglia',main:`Taglia il <span class="key">cavo chiave</span>.`};solve=(m,tag)=>key(m,tag)}
    else if(f2===1){f1={role:'agisci',tag:'Taglia',main:`Taglia il cavo <b>subito sotto</b> quello chiave.`,note:'Se il cavo chiave è l\'ultimo, taglia il n° 1.'};solve=(m,tag)=>(key(m,tag)+1)%m.wires.length}
    else {f1={role:'agisci',tag:'Taglia',main:`Taglia il cavo <b>subito sopra</b> quello chiave.`,note:'Se il cavo chiave è il n° 1, taglia l\'ultimo.'};solve=(m,tag)=>(key(m,tag)-1+m.wires.length)%m.wires.length}
  }
  else if(ti===1){ // PULSANTI
    const f2=t===1?p[0]:p[1];
    if(t===0){f0={role:'osserva',tag:'Il colore chiave',main:`Il <span class="key">colore chiave</span> è quello del pulsante ${K(LABELS[p[0]])}.`}}
    else if(t===1){f0={role:'osserva',tag:'Il colore chiave',main:`Il <span class="key">colore chiave</span> è il colore della <b>targhetta</b>.`};needs={btnTag:true}}
    else {f0={role:'osserva',tag:'Il colore chiave',main:`Il <span class="key">colore chiave</span> è quello del pulsante <b>n° ${p[0]+1}</b>.`}}
    const keyc=(m,tag)=>t===0?m.btns.find(b=>b.l===LABELS[p[0]]).c:t===1?tag.c:m.btns[p[0]].c;
    needs={btnKey:keyc};
    if(f2===0){f1={role:'agisci',tag:'Premi',main:`Premi il pulsante del <span class="key">colore chiave</span> con il <b>numero più basso</b>.`};solve=(m,tag)=>{const c=keyc(m,tag);return m.btns.findIndex(b=>b.c===c)}}
    else {f1={role:'agisci',tag:'Premi',main:`Premi il pulsante del <span class="key">colore chiave</span> con il <b>numero più alto</b>.`};solve=(m,tag)=>{const c=keyc(m,tag);let i=0;m.btns.forEach((b,j)=>{if(b.c===c)i=j});return i}}
  }
  else if(ti===2){ // POMELLO
    const f2=p[0];
    if(t===0)f0={role:'osserva',tag:'Il numero chiave',main:`Il <span class="key">numero chiave</span> è il numero della <b>targhetta</b>.`};
    else if(t===1)f0={role:'osserva',tag:'Il numero chiave',main:`Il <span class="key">numero chiave</span> è il numero del <b>display</b>.`};
    else f0={role:'osserva',tag:'Il numero chiave',main:`Il <span class="key">numero chiave</span> è la <b>differenza</b> tra display e targhetta.`,note:'Senza segno: il più grande meno il più piccolo.'};
    const keyn=(m,tag)=>t===0?tag.n:t===1?m.d:Math.abs(m.d-tag.n);
    if(f2===0){f1={role:'agisci',tag:'Gira',main:`Gira il pomello sul <span class="key">numero chiave</span>.`};solve=(m,tag)=>keyn(m,tag)}
    else {f1={role:'agisci',tag:'Gira',main:`Parti dal <b>9</b> e torna indietro del <span class="key">numero chiave</span>.`,note:'Numero chiave 0 → 9, 1 → 8, e così via.'};solve=(m,tag)=>9-keyn(m,tag)}
  }
  else if(ti===3){ // SEQUENZA
    const d1=DIRS[p[0]],d2=DIRS[p[1]];let cond,test;
    if(t===0){cond=`la targhetta è ${C(WC[p[2]])}`;test=(m,tag)=>tag.c===WC[p[2]]}
    else if(t===1){cond=`il numero della targhetta è <b>pari</b>`;test=(m,tag)=>tag.n%2===0}
    else {cond=`i passi sono <b>${p[2]}</b>`;test=m=>m.len===p[2]}
    const f2=t===1?p[2]:p[3];
    f0={role:'agisci',tag:'Il primo passo',main:`${D(d1)} se ${cond}, altrimenti ${D(d2)}.`};
    const first=(m,tag)=>test(m,tag)?d1:d2;
    const rest=[
      {main:`Ogni passo dopo il primo <b>gira in senso orario</b>.`,note:`${DGLY.su} ${DGLY.des} ${DGLY.giu} ${DGLY.sin} e si ricomincia.`,f:(d,i)=>CWO[(CWO.indexOf(d)+i)%4]},
      {main:`Ogni passo dopo il primo <b>gira in senso antiorario</b>.`,note:`${DGLY.su} ${DGLY.sin} ${DGLY.giu} ${DGLY.des} e si ricomincia.`,f:(d,i)=>CWO[(CWO.indexOf(d)-i+8)%4]},
      {main:`I passi si <b>alternano</b> tra il primo e il suo opposto.`,f:(d,i)=>i%2?OPP[d]:d},
      {main:`Tutti i passi sono <b>uguali al primo</b>, tranne l'ultimo che è il suo opposto.`,f:(d,i,L)=>i===L-1?OPP[d]:d}
    ][f2];
    f1={role:'agisci',tag:'I passi dopo',main:rest.main,note:rest.note};
    solve=(m,tag)=>{const d0=first(m,tag);return Array.from({length:m.len},(_,i)=>rest.f(d0,i,m.len))};
  }
  else { // INTERRUTTORI
    const f2=t===2?p[0]:(t===0?p[1]:p[0]),k=t===0?p[2]:p[1],col=t===1?null:WC[t===0?p[0]:p[2]];
    if(t===0){f0={role:'agisci',tag:'Vanno su',main:`Vanno su gli interruttori ${C(col)}.`}}
    else if(t===1)f0={role:'agisci',tag:'Vanno su',main:`Vanno su gli interruttori del colore della <b>targhetta</b>.`};
    else f0={role:'agisci',tag:'Vanno su',main:`Vanno su gli interruttori che <b>non</b> sono ${C(col)}.`};
    const keyc=tag=>t===1?tag.c:col;
    const setA=(m,tag)=>m.sw.map(s=>t===2?s.c!==keyc(tag):s.c===keyc(tag));
    const extras=[
      {main:`Va su <b>anche</b> l'interruttore <b>n° ${k+1}</b>.`,f:m=>Math.min(k,m.sw.length-1)},
      {main:`Va su <b>anche</b> l'<b>ultimo</b> interruttore.`,f:m=>m.sw.length-1},
      {main:`Va su <b>anche</b> il <b>primo</b> interruttore.`,f:()=>0}
    ][f2];
    f1={role:'agisci',tag:'E in più',main:extras.main,note:'Tutti gli altri vanno giù.'};
    solve=(m,tag)=>{const a=setA(m,tag);a[extras.f(m)]=true;return a};
    needs={swKey:keyc,swNot:t===2,swExtra:extras.f};
  }
  return{ti,t,p,type:TYPES[ti],title:TITLES[ti],frags:[f0,f1],solve,needs};
}
function randRule(ti){
  const t=rnd(3),L=LEN[ti][t],p=[];
  if(ti===0){if(t<2){p.push(rnd(5));p.push(rnd(3))}else p.push(rnd(3))}
  else if(ti===1){if(t===0){p.push(rnd(4));p.push(rnd(2))}else if(t===1)p.push(rnd(2));else{p.push(rnd(4));p.push(rnd(2))}}
  else if(ti===2)p.push(rnd(2));
  else if(ti===3){const d=shuffle([0,1,2,3]);p.push(d[0]);p.push(d[1]);if(t===0)p.push(rnd(5));else if(t===2)p.push(3+rnd(3));p.push(rnd(4));}
  else {if(t===0){p.push(rnd(5));p.push(rnd(3));p.push(rnd(4))}else if(t===1){p.push(rnd(3));p.push(rnd(4))}else{p.push(rnd(3));p.push(rnd(4));p.push(rnd(5))}}
  while(p.length<L)p.push(0);
  return buildRule(ti,t,p.slice(0,L));
}

/* ---------- distribuzione dei frammenti ----------
   Ogni frammento deve stare in mano ad almeno un artificiere, altrimenti il modulo è irrisolvibile
   o verificabile solo dal traditore. Nessuno riceve le due metà della stessa regola. */
function dealFrags(players,nRules){
  const F=nRules*2,n=players.length,art=players.map((p,i)=>i).filter(i=>!players[i].sab);
  for(let tries=0;tries<4000;tries++){
    const hands=players.map(()=>[]),slots=[];
    art.forEach(i=>{slots.push(i);slots.push(i)});
    const order=shuffle([...Array(F).keys()]),pool=shuffle(slots);let ok=true;
    for(const f of order){
      const cand=pool.filter(i=>hands[i].length<2&&!hands[i].some(x=>(x>>1)===(f>>1)&&x!==f)&&!hands[i].includes(f));
      if(!cand.length){ok=false;break}
      hands[pick(cand)].push(f);
    }
    if(!ok)continue;
    const all=[...Array(F).keys()];
    for(let i=0;i<n;i++)while(hands[i].length<2){
      const cand=all.filter(f=>!hands[i].includes(f)&&!hands[i].some(x=>(x>>1)===(f>>1)));
      if(!cand.length){ok=false;break}
      hands[i].push(pick(cand));
    }
    if(!ok)continue;
    const cov=new Set();art.forEach(i=>hands[i].forEach(f=>cov.add(f)));
    if(cov.size<F)continue;
    players.forEach((p,i)=>p.frags=hands[i].sort((a,b)=>a-b));return true;
  }
  players.forEach((p,i)=>p.frags=[(2*i)%F,(2*i+3)%F].sort((a,b)=>a-b));return false;
}

/* ---------- moduli ---------- */
function makeModule(type,id,d,rule,tag){
  const base={id,type,solved:false,shown:'grey',fake:false};
  let m;
  if(type==='cavi'){const n=between(d.wires[0],d.wires[1]);m={...base,wires:Array.from({length:n},()=>({c:pick(WC),cut:false}))};
    const need=rule.needs&&(rule.needs.wireCol||(rule.needs.wireTag?tag.c:null));
    if(need&&!m.wires.some(w=>w.c===need))m.wires[rnd(n)].c=need;}
  else if(type==='pulsanti'){m={...base,btns:shuffle(LABELS).map(l=>({l,c:pick(WC)})),pressed:null};
    // il colore chiave deve stare su almeno due pulsanti, altrimenti il secondo frammento non serve
    if(rule.needs&&rule.needs.btnTag&&!m.btns.some(b=>b.c===tag.c))m.btns[rnd(4)].c=tag.c;
    for(let g=0;g<3;g++){const key=rule.needs.btnKey(m,tag),have=m.btns.map((b,i)=>i).filter(i=>m.btns[i].c===key);
      if(have.length>=2)break;
      const free=m.btns.map((b,i)=>i).filter(i=>!have.includes(i));m.btns[pick(free)].c=key}
    if(m.btns.every(b=>b.c===m.btns[0].c))m.btns[rnd(4)].c=pick(WC.filter(c=>c!==m.btns[0].c));}
  else if(type==='pomello')m={...base,d:rnd(10),pos:rnd(10)};
  else if(type==='sequenza'){m={...base,len:between(d.seq[0],d.seq[1])}}
  else{const n=between(d.sw[0],d.sw[1]);m={...base,sw:Array.from({length:n},()=>({c:pick(WC),up:Math.random()<.5}))};
    const key=rule.needs.swKey(tag),alt=WC.filter(c=>c!==key),ex=rule.needs.swExtra(m);
    // la prima regola deve selezionare qualcosa, e la seconda deve aggiungere un interruttore non già selezionato
    if(!m.sw.some(s=>s.c===key))m.sw[(ex+1)%n].c=key;
    if(rule.needs.swNot){if(!m.sw.some(s=>s.c!==key))m.sw[(ex+1)%n].c=pick(alt);m.sw[ex].c=key}
    else{m.sw[ex].c=pick(alt);if(!m.sw.some(s=>s.c===key))m.sw[(ex+1)%n].c=key}}
  // la risposta non deve coincidere con lo stato iniziale
  const a=rule.solve(m,tag);
  if(type==='pomello'&&m.pos===a)m.pos=(a+3+rnd(5))%10;
  if(type==='interruttori'&&m.sw.every((s,i)=>s.up===a[i])){const j=rnd(m.sw.length);m.sw[j].up=!m.sw[j].up}
  return m;
}
const sameAns=(a,b)=>Array.isArray(a)?a.length===b.length&&a.every((x,i)=>x===b[i]):a===b;
function answer(m){return G.rules[G.ruleOf[m.type]].solve(m,G.bomb.tag)}

  try{if(!/^c\d{6,}$/.test(tok))return null;const key=+tok[1];const d=tok.slice(2).split('').map((c,i)=>((+c-key-i*3)%10+20)%10);
    let i=2;const out={sab:d[0]===1,card:CARDKEYS[d[1]],frags:[]};

}

function newBomb(){

  const fresh=act.filter(i=>!b.holds[i]);if(fresh.length)return{act,free:fresh,fresh:true};

const fuseSec=()=>!G.fuse?0:(G.tut&&G.bombNo===0)?Math.max(G.fuse,45):G.fuse;

function trySwap(m){
  const un=m.wires.map((w,i)=>w.cut?-1:i).filter(i=>i>=0),pairs=[];
  for(let a=0;a<un.length;a++)for(let b=a+1;b<un.length;b++)if(m.wires[un[a]].c!==m.wires[un[b]].c)pairs.push([un[a],un[b]]);
  for(const[a,b]of shuffle(pairs)){const w=m.wires;[w[a],w[b]]=[w[b],w[a]];if(!w[answer(m)].cut)return true;[w[a],w[b]]=[w[b],w[a]]}
  return false;
}

function act(mi,choice){
  const b=G.bomb,t=G.turn,m=b.modules[mi];if(t.acted)return;
  const correct=!m.solved&&sameAns(choice,answer(m)),wasLast=lastModule()&&m.shown!=='green';
  if(m.type==='cavi'){m.wires[choice].cut=true;sfx.cut()}
  else if(m.type==='pulsanti'){m.pressed=choice;sfx.thunk()}
  else if(m.type==='pomello'){m.pos=choice;sfx.clunk()}
  else if(m.type==='sequenza'){m.entered=choice;sfx.beep()}
  else{m.sw=m.sw.map((s,i)=>({...s,up:choice[i]}));sfx.flick()}
  let kind,note='',fr=false;const wasAlibi=t.alibi;
  if(t.alibi){t.alibi=false;if(correct)m.solved=true;if(!m.solved)m.fake=true;m.shown='green';kind='green';addEv('alibiUse',{p:t.p,mod:m.id})}
  else if(m.solved){if(m.shown==='red'){m.shown='green';kind='green'}else{b.errors++;kind='red';note='Il modulo era già risolto.'}}
  else if(correct){m.solved=true;m.fake=false;if(b.falseRed){const by=b.falseRed.by;b.falseRed=false;b.stats.falseRed++;m.shown='red';b.errors++;kind='red';fr=true;addEv('frHit',{p:t.p,mod:m.id,by})}else{m.shown='green';kind='green'}}
  else{b.errors++;m.shown='red';m.fake=false;kind='red'}
  b.turnsUsed++;t.acted=true;t.res={mi,kind,note,v:choice};S.pick=null;
  b.log.push({p:t.p,mod:m.id,kind,fr,alibi:wasAlibi});
  const reveal=()=>{if(kind==='green'){sfx.good();vib(40)}else{sfx.bad();vib([120,60,180])}};
  const unhold=()=>setTimeout(()=>{if(G.turn===t&&S.hold){S.hold=false;if(S.screen==='turn')render()}},1100);
  S.hold=true;
  if(wasLast){S.suspense=true;render();setTimeout(()=>{S.suspense=false;reveal();checkEnd();render();unhold()},1500)}
  else{setTimeout(reveal,180);checkEnd();render();unhold()}
}
function timeout(){const b=G.bomb,t=G.turn;if(t.acted||b.outcome)return;
  t.alibi=false;b.turnsUsed++;t.acted=true;t.res={kind:'tempo',note:'Turno perso.'};S.sheet=false;S.swapPick=false;S.pick=null;S.hold=false;
  b.log.push({p:t.p,mod:null,kind:'tempo'});sfx.bad();vib([200,80,200]);render()}
function endBomb(r,why){if(G.bomb.outcome)return;G.bomb.outcome={r,why};G.results.push(r);
  G.past.push({n:G.bombNo,r,why,log:G.bomb.log,ev:G.bomb.ev});go('bomb-end');
  if(r==='E'){sfx.boom();vib([300,100,500]);const f=document.createElement('div');f.className='flash';document.body.appendChild(f);setTimeout(()=>f.remove(),1200);document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),700)}
  else{sfx.defuse();vib([60,40,60])}}
function decided(){
  const d=G.results.filter(r=>r==='D').length,e=G.results.filter(r=>r==='E').length;
  if(G.players.filter(p=>p.sab).every(p=>p.out))return{w:'A',why:'Tutti i traditori smascherati.'};

}

  return`<div class="top"><div class="top-row"><span>Bomba <b>${G.bombNo+1}</b>/3</span><span class="pips" aria-label="${b.errors} errori su ${b.maxErr}">${pips}</span><span>${withPlate?plateHTML():`<b>${turnsLeft()}</b> turni`}</span></div>${withPlate?`<div class="top-row"><span><b>${turnsLeft()}</b> turni rimasti</span><span>${DIFFS[G.diff].nome}</span></div>`:''}${fuse}</div>`;

function knobHTML(m,i,wide,dis){

function seqHTML(m,i,dis){

function ledHTML(m,waiting){if(waiting)return'<span class="led wait" aria-label="in attesa">?</span>';return`<span class="led ${m.shown}" aria-label="spia ${m.shown==='grey'?'spenta':m.shown==='green'?'verde':'rossa'}">${m.shown==='green'?'✓':m.shown==='red'?'✕':''}</span>`}
function moduleTile(m,i,n){

/* finale */
function filmList(pb){
  const N=i=>nm(i),SB=i=>`<b>${nm(i)}</b>`,items=[];
  pb.ev.forEach(e=>{let tx='',sab=false;
    if(e.type==='frArm'){tx=`${SB(e.p)} arma il Falso rosso`;sab=true}
    else if(e.type==='frHit'){tx=`${N(e.p)} fa la mossa giusta sul modulo ${e.mod} e vede rosso`;sab=true}
    else if(e.type==='alibiUse'){tx=`${SB(e.p)} accende un verde finto sul modulo ${e.mod}`;sab=true}
    else if(e.type==='swap'){tx=`${SB(e.p)} scambia i cavi del modulo ${e.mod}`;sab=true}
    else if(e.type==='force')tx=`${N(e.p)} gioca ${CARDS[e.card].t} su ${N(e.target)}`;
    if(tx)items.push({t:e.t,o:0,tx,sab})});
  pb.log.forEach((l,i)=>{if(l.kind==='tempo')items.push({t:i+1,o:1,tx:`${N(l.p)} resta impietrito`});else if(l.kind==='red'&&!l.fr)items.push({t:i+1,o:1,tx:`${N(l.p)} sbaglia il modulo ${l.mod}`})});
  items.sort((a,b)=>a.t-b.t||a.o-b.o);
  if(pb.acc)items.push({t:'voto',tx:pb.acc.p<0?'Nessuna maggioranza':`Accusato ${N(pb.acc.p)}: ${pb.acc.sab?'<b class="bad">traditore</b>':'innocente'}`});
  return`<ul class="rows film">${items.length?items.map(x=>`<li class="${x.sab?'sab':''}"><span class="r">${x.t==='voto'?'voto':'t'+x.t}</span><span>${x.tx}</span></li>`).join(''):'<li><span class="mute">Nessun colpo basso.</span></li>'}</ul>`;
}
function awardsHTML(){
  const n=G.players.length,z=()=>Array(n).fill(0),red=z(),green=z(),tempo=z(),fr=z(),trust=z(),held=z();
  G.past.forEach(pb=>pb.log.forEach(l=>{held[l.p]++;
    if(l.kind==='red'&&!l.fr)red[l.p]++;if(l.kind==='green'&&!l.alibi)green[l.p]++;if(l.kind==='tempo')tempo[l.p]++;if(l.fr)fr[l.p]++;
    if(l.to!=null&&!G.players[l.p].sab&&G.players[l.to].sab)trust[l.p]++}));
  const topOf=arr=>{const m=Math.max(...arr);if(m<=0)return null;const w=arr.map((v,i)=>v===m?i:-1).filter(i=>i>=0);return w.length<=2?{w,m}:null};
  const names=w=>w.map(i=>nm(i)).join(' e '),list=[];
  const add=(t,arr,why)=>{const r=topOf(arr);if(r)list.push({t,who:names(r.w),why:why(r.m)})};
  add('Mani d\'oro',green,m=>`${m} verdi veri`);
  add('Mano tremante',red,m=>`${m} ${m===1?'errore':'errori'}`);
  add('Capro espiatorio',fr,()=>'giusto, ma rosso');
  add('Fiducia cieca',trust,m=>`passata ${m}× a un traditore`);
  add('Lumaca d\'oro',tempo,m=>`${m} ${m===1?'miccia finita':'micce finite'}`);
  add('Il prediletto',held,m=>`bomba in mano ${m} volte`);
  const bronze=G.players.map((p,i)=>p.sab&&!p.out?i:-1).filter(i=>i>=0);
  if(bronze.length)list.push({t:'Faccia di bronzo',who:names(bronze),why:'mai smascherato'});
  return`<div class="awards">${list.slice(0,6).map(a=>`<div class="award"><span class="t">${a.t}</span><span class="w">${a.who}</span><span class="y">${a.why}</span></div>`).join('')}</div>`;
}

  if(!S.cardShow)return`<div class="cover"><div class="stack"><div class="display" style="font-size:1.9rem">Carta coperta</div><p class="mute small">Controlla che nessuno guardi.</p></div></div><div class="bottom"><button class="btn primary" data-a="cardToggle">Mostra</button></div>`;

/* ---------- render e azioni ---------- */
function go(s){S.screen=s;render()}
function render(){
  $app.innerHTML=V[S.screen]();
  clearInterval(tickTimer);tickTimer=null;clearInterval(fuseTimer);fuseTimer=null;
  if(S.screen==='turn'&&!G.turn.acted){
    const heart=lastModule(),fs=fuseSec();
    if(fs&&G.turn.deadline){let lastSec=-1;
      const upd=()=>{const ms=G.turn.deadline-Date.now(),r=Math.max(0,Math.ceil(ms/1000));
        document.querySelectorAll('.fuse-n').forEach(e=>e.textContent=r);document.querySelectorAll('.fuse-bar').forEach(e=>e.style.width=Math.min(100,ms/(fs*10))+'%');
        document.querySelectorAll('.fuse').forEach(e=>e.classList.toggle('hot',r<=5));
        if(r!==lastSec){lastSec=r;if(r>0){if(heart){sfx.heart();if(r<=5)vib(60)}else{sfx.tick(r<=5);if(r<=10)setTimeout(()=>sfx.tick(r<=5),r<=5?160:500)}}}
        if(ms<=0)timeout()};
      upd();fuseTimer=setInterval(upd,200)}
    else if(heart)tickTimer=setInterval(()=>sfx.heart(),1000);
    else{const l=turnsLeft(),ms=l<=1?300:l<=2?550:1000;tickTimer=setInterval(()=>sfx.tick(),ms)}
  }
  if(S.screen!=='discuss'){clearInterval(discTimer);discTimer=null}
  if(!['card','setup','rules'].includes(S.screen))save();
}
function resume(){const s=loadSave();if(!s)return;
  G=hydrate(s.G);S.revealI=s.revealI||0;S.accused=s.accused;S.sheet=false;S.swapPick=false;S.pick=null;S.hold=false;S.qr=false;wake();
  let scr=s.screen;
  if(scr==='turn'){const b=G.bomb;if(!b.outcome&&(allSolved()||b.errors>=b.maxErr)){S.screen='turn';endBomb(allSolved()?'D':'E',allSolved()?'Tutti i moduli risolti.':'Troppi errori.');return}
    if(!G.turn.acted){G.turn.deadline=0;scr='handoff'}}
  if(scr==='reveal-show')scr='reveal-pass';
  if(scr==='discuss'){H.discuss();return}
  if(scr==='vote')S.vc='idle';
  go(scr);
}
const H={
  n:v=>{S.n=Math.min(8,Math.max(4,S.n+ +v));S.sab=Math.min(S.sab,S.n-2);saveOpt();render()},
  sab:v=>{S.sab=Math.min(Math.max(1,S.sab+ +v),Math.min(3,S.n-2));saveOpt();render()},
  diff:v=>{S.diff=v;S.fuse=DIFFS[v].fuse;saveOpt();render()},
  fuse:v=>{const o=[0,15,20,25,30,35,40,45,50,55,60];let i=o.indexOf(S.fuse);if(i<0)i=4;S.fuse=o[Math.min(o.length-1,Math.max(0,i+(+v>0?1:-1)))];saveOpt();render()},
  tut:()=>{S.tut=!S.tut;saveOpt();render()},
  start:()=>{clearSave();newGame()},
  resume:()=>resume(),
  discard:()=>{clearSave();render()},
  go:v=>go(v),
  reveal:()=>{S.qr=false;go('reveal-show')},
  qrOn:()=>{S.qr=true;render()},qrOff:()=>{S.qr=false;render()},
  revealDone:()=>{S.qr=false;S.revealI++;if(S.revealI<G.players.length)go('reveal-pass');else newBomb()},
  bombGo:()=>{newTurn(G.bomb.first);go('handoff')},
  turnGo:()=>{if(fuseSec())G.turn.deadline=Date.now()+fuseSec()*1000;go('turn')},
  pick:(v,el)=>{if(G.turn.acted||S.suspense)return;const mi=+el.dataset.m,m=G.bomb.modules[mi];S.pick={mi,v:+v};if(m.type==='pomello')sfx.clunk();else sfx.click();render()},
  knobStep:(v,el)=>{if(G.turn.acted||S.suspense)return;const mi=+el.dataset.m,m=G.bomb.modules[mi],cur=S.pick&&S.pick.mi===mi?S.pick.v:m.pos;S.pick={mi,v:(cur+1)%10};sfx.clunk();render()},
  seq:(v,el)=>{if(G.turn.acted||S.suspense)return;const mi=+el.dataset.m,m=G.bomb.modules[mi],cur=S.pick&&S.pick.mi===mi?[...S.pick.v]:[];
    if(cur.length>=m.len)return;cur.push(v);S.pick={mi,v:cur};sfx.beep();render()},
  seqDel:(v,el)=>{const mi=+el.dataset.m;if(!S.pick||S.pick.mi!==mi||!S.pick.v.length)return;S.pick={mi,v:S.pick.v.slice(0,-1)};sfx.click();render()},
  sw:(v,el)=>{if(G.turn.acted||S.suspense)return;const mi=+el.dataset.m,m=G.bomb.modules[mi],j=+v;
    const cur=S.pick&&S.pick.mi===mi?[...S.pick.v]:m.sw.map(s=>s.up);cur[j]=!cur[j];S.pick={mi,v:cur};sfx.flick();render()},
  unpick:()=>{S.pick=null;render()},
  act:()=>{if(!S.pick||!pickReady())return;const{mi,v}=S.pick;S.pick=null;act(mi,v)},
  pass:()=>{const b=G.bomb,t=G.turn;if(t.acted)return;S.pick=null;b.passed[t.p]=true;b.turnsUsed++;t.acted=true;t.alibi=false;t.res={kind:'pass'};b.log.push({p:t.p,mod:null,kind:'pass'});render()},
  passTo:v=>{const b=G.bomb;if(b.outcome)return;const last=b.log[b.log.length-1];if(last)last.to=+v;newTurn(+v);sfx.tick();go('handoff')},
  endTurn:()=>{const b=G.bomb;if(b.outcome)return;endBomb('E','I turni sono finiti.')},
  sheet:()=>{S.sheet=true;S.tab='frag';S.swapPick=false;render()},
  sheetClose:()=>{S.sheet=false;S.swapPick=false;render()},
  tab:v=>{S.tab=v;S.swapPick=false;render()},
  forcePlay:v=>{const p=G.turn.p,P=G.players[p];if(P.cardUsed)return;P.cardUsed=true;G.pending[+v]={type:P.card,by:p};addEv('force',{p,target:+v,card:P.card});sfx.click();render()},
  sabRed:()=>{const b=G.bomb,p=G.turn.p;if(b.falseRed||!(b.sabLeft[p]>0))return;b.falseRed={by:p};b.sabLeft[p]--;b.stats.used++;addEv('frArm',{p});sfx.click();render()},
  sabAlibi:()=>{const b=G.bomb,p=G.turn.p;if(G.turn.alibi||G.turn.acted||!(b.sabLeft[p]>0))return;G.turn.alibi=true;b.sabLeft[p]--;b.stats.used++;b.stats.alibi++;sfx.click();render()},
  sabSwapOpen:()=>{S.swapPick=true;render()},
  swapBack:()=>{S.swapPick=false;render()},
  sabSwap:v=>{const b=G.bomb,p=G.turn.p;if(b.sabLeft[p]>0&&trySwap(b.modules[+v])){b.sabLeft[p]--;b.stats.used++;b.stats.swap++;addEv('swap',{p,mod:b.modules[+v].id});S.pick=null}S.swapPick=false;sfx.click();render()},
  discuss:()=>{S.disc=60;go('discuss');discTimer=setInterval(()=>{S.disc--;const el=document.getElementById('disc');if(el)el.textContent=S.disc;if(S.disc<=10&&S.disc>0)sfx.tick();if(S.disc<=0){clearInterval(discTimer);S.vc='idle';go('vote')}},1000)},
  toVote:()=>{S.vc='idle';go('vote')},
  voteGo:()=>{const seq=[3,2,1,'Punta!'];seq.forEach((x,i)=>setTimeout(()=>{S.vc=x;render();x==='Punta!'?(tone(880,.4,'square',.1),vib(200)):tone(440,.12,'square',.08)},i*900));setTimeout(()=>{S.vc='pick';render()},seq.length*900+600)},
  accuse:v=>{S.accused=+v;const pb=G.past[G.past.length-1];if(pb)pb.acc=S.accused>=0?{p:S.accused,sab:G.players[S.accused].sab}:{p:-1};
    if(S.accused>=0){const P=G.players[S.accused];if(P.sab){P.out=true;sfx.good()}else{G.nextPenalty=1;sfx.bad()}}go('vote-result')},
  nextBomb:()=>{G.bombNo++;newBomb()},
  endTab:v=>{S.endTab=v;render()},
  filmBomb:v=>{S.filmBomb=+v;render()},
  manRule:v=>{S.manRule=+v;render()},
